[project]
name = "forged-mcp-template"
version = "0.1.0"
description = "Golden FastMCP server template"
requires-python = ">=3.11"
dependencies = ["mcp>=1.2,<2", "pydantic>=2", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff", "mypy"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
